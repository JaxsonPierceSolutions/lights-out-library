# Publishes a GitHub Release with a download zip whenever a version tag (v1.0, v1.1, ...) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the download
        run: |
          name="lights-out-library-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
          sha256sum "${name}.zip" > "${name}.zip.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lights-out-library-*.zip lights-out-library-*.zip.sha256 \
            --title "Lights Out Library ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md
