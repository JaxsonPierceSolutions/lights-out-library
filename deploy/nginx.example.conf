# Example: serve a built library (python -m lightsout.build --out /srv/lights-out/site ...)
# with nginx. Only on a network you trust: the library has no logins.
server {
  listen 8080;
  root /srv/lights-out/site;
  index index.html;

  # Pages may load only from this server.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'" always;

  location / { try_files $uri $uri/ =404; }
  location /api/ { default_type application/json; }

  # kiwix-serve --address 127.0.0.1 --port 8601 --urlRootLocation /kiwix /path/to/*.zim
  location /kiwix/ { proxy_pass http://127.0.0.1:8601; proxy_read_timeout 120s; }

  # Optional: python -m lightsout.askserve --port 8095
  location /ask/api/ { proxy_pass http://127.0.0.1:8095/; proxy_buffering off; proxy_read_timeout 300s; }

  # Optional: your own files, as a JSON listing for files.html
  location /files/ { alias /srv/lights-out/files/; autoindex on; autoindex_format json; }
}
